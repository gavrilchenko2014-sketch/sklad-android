name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android wrapper
        run: |
          flutter create --platforms=android --project-name sklad_bk --org ua.sklad.bk build_app
          rm -rf build_app/lib
          rm -rf build_app/test
          cp -R lib build_app/lib
          cp pubspec.yaml build_app/pubspec.yaml
          cp analysis_options.yaml build_app/analysis_options.yaml

          # v6.1: защита приложения и новое меню резервных копий
          python3 tools/apply_v6.py build_app/lib/main.dart

          # local_auth требует FlutterFragmentActivity.
          cat > build_app/android/app/src/main/kotlin/ua/sklad/bk/MainActivity.kt <<'KOTLIN'
          package ua.sklad.bk

          import android.os.Build
          import android.os.Bundle
          import io.flutter.embedding.android.FlutterFragmentActivity

          class MainActivity: FlutterFragmentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      setRecentsScreenshotEnabled(false)
                  }
              }
          }
          KOTLIN

          python3 - <<'PY'
          from pathlib import Path

          manifest = Path('build_app/android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')
          if 'android.permission.USE_BIOMETRIC' not in text:
              text = text.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n'
                  '    <uses-permission android:name="android.permission.USE_BIOMETRIC"/>',
                  1,
              )
          if 'android:allowBackup=' not in text:
              text = text.replace(
                  '<application',
                  '<application\n        android:allowBackup="false"',
                  1,
              )
          manifest.write_text(text, encoding='utf-8')

          # Для BiometricPrompt на старых поддерживаемых версиях Android.
          for name in ['values/styles.xml', 'values-night/styles.xml']:
              p = Path('build_app/android/app/src/main/res') / name
              if not p.exists():
                  continue
              s = p.read_text(encoding='utf-8')
              s = s.replace(
                  'parent="@android:style/Theme.Light.NoTitleBar"',
                  'parent="Theme.AppCompat.DayNight.NoActionBar"',
              )
              s = s.replace(
                  'parent="@android:style/Theme.Black.NoTitleBar"',
                  'parent="Theme.AppCompat.DayNight.NoActionBar"',
              )
              p.write_text(s, encoding='utf-8')

          gradle = Path('build_app/android/app/build.gradle.kts')
          g = gradle.read_text(encoding='utf-8')
          if 'androidx.appcompat:appcompat' not in g:
              g += '\n\ndependencies {\n    implementation("androidx.appcompat:appcompat:1.7.1")\n}\n'
          gradle.write_text(g, encoding='utf-8')
          PY

      - name: Install dependencies
        working-directory: build_app
        run: flutter pub get

      - name: Analyze
        working-directory: build_app
        run: flutter analyze

      - name: Build release APK
        working-directory: build_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sklad-android-apk
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
