name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android wrapper
        run: |
          flutter create --platforms=android --project-name sklad_bk --org ua.sklad.bk build_app
          rm -rf build_app/lib
          rm -rf build_app/test
          cp -R lib build_app/lib
          cp pubspec.yaml build_app/pubspec.yaml
          cp analysis_options.yaml build_app/analysis_options.yaml

          # v6: добавляем блокировку и новое меню резервных копий
          python3 tools/apply_v6.py build_app/lib/main.dart

          # ВАЖНО: Flutter добавляет project-name к --org, поэтому фактический
          # package/MainActivity создаётся не в жёстко заданном пути.
          # Находим реальный MainActivity и заменяем именно его.
          MAIN_ACTIVITY="$(find build_app/android/app/src/main/kotlin -name MainActivity.kt -print -quit)"
          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "MainActivity.kt not found"
            exit 1
          fi

          python3 - "$MAIN_ACTIVITY" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])
          original = path.read_text(encoding='utf-8')
          match = re.search(r'^package\s+([^\s]+)', original, re.MULTILINE)
          if not match:
              raise SystemExit('Could not determine Android package from MainActivity.kt')
          package_name = match.group(1)

          path.write_text(
              f'''package {package_name}

          import android.os.Build
          import android.os.Bundle
          import io.flutter.embedding.android.FlutterFragmentActivity

          class MainActivity: FlutterFragmentActivity() {{
              override fun onCreate(savedInstanceState: Bundle?) {{
                  super.onCreate(savedInstanceState)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {{
                      setRecentsScreenshotEnabled(false)
                  }}
              }}
          }}
          ''',
              encoding='utf-8',
          )
          print(f'Patched real MainActivity: {path} ({package_name})')
          PY

          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path('build_app/android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')
          if 'android.permission.USE_BIOMETRIC' not in text:
              text = re.sub(
                  r'(<manifest\b[^>]*>)',
                  r'\1\n    <uses-permission android:name="android.permission.USE_BIOMETRIC"/>',
                  text,
                  count=1,
              )
          if 'android:allowBackup=' not in text:
              text = text.replace(
                  '<application',
                  '<application\n        android:allowBackup="false"',
                  1,
              )
          manifest.write_text(text, encoding='utf-8')

          # local_auth требует AppCompat-тему. Меняем и LaunchTheme, и NormalTheme.
          for name in ['values/styles.xml', 'values-night/styles.xml']:
              p = Path('build_app/android/app/src/main/res') / name
              if not p.exists():
                  continue
              s = p.read_text(encoding='utf-8')
              s = re.sub(
                  r'parent="@android:style/Theme\.[^"]*NoTitleBar"',
                  'parent="Theme.AppCompat.DayNight.NoActionBar"',
                  s,
              )
              p.write_text(s, encoding='utf-8')

          gradle = Path('build_app/android/app/build.gradle.kts')
          g = gradle.read_text(encoding='utf-8')
          if 'androidx.appcompat:appcompat' not in g:
              g += '\n\ndependencies {\n    implementation("androidx.appcompat:appcompat:1.7.1")\n}\n'
          gradle.write_text(g, encoding='utf-8')
          PY

      - name: Install dependencies
        working-directory: build_app
        run: flutter pub get

      - name: Analyze
        working-directory: build_app
        run: flutter analyze

      - name: Build release APK
        working-directory: build_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sklad-android-apk
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
